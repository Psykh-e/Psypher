name: security-and-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt --strict
      - run: python -m pip_audit -r requirements-dev.txt --strict
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --console --name Psypher --paths src scripts/entrypoint.py
          & './dist/Psypher/Psypher.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Executable smoke test failed' }
          Copy-Item -LiteralPath 'README.md', 'LICENSE', 'SECURITY.md' -Destination './dist/Psypher'
          Copy-Item -LiteralPath 'docs' -Destination './dist/Psypher' -Recurse
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Psypher-Windows-beta
          path: dist/Psypher
