[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psypher-vault"
version = "2.0.0b1"
description = "Local encrypted file vault with a Turkish console and automation CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "PyNaCl==1.6.2",
  "cryptography==50.0.2",
  "rich==15.0.0",
  "portalocker==4.4.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "pip-audit==2.10.1", "pyinstaller==6.22.3"]

[project.scripts]
psypher = "psypher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["large: opt-in 10 GiB streaming benchmark"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
